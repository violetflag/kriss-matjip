# Supabase 무료 플랜은 7일간 요청이 없으면 프로젝트를 일시정지한다.
# 3일마다 가벼운 조회를 한 번 보내 정지를 막는다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 */3 * *"   # 3일마다 09:00 KST (00:00 UTC)
  workflow_dispatch:          # Actions 탭에서 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # 아래 self-enable 단계용
    steps:
      - uses: actions/checkout@v4

      # URL과 anon 키는 이미 공개된 config.js에서 읽는다 (별도 Secret 불필요)
      - name: Ping Supabase
        run: |
          SUPABASE_URL=$(grep -o 'SUPABASE_URL: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          SUPABASE_ANON_KEY=$(grep -o 'SUPABASE_ANON: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::config.js에서 SUPABASE_URL / SUPABASE_ANON 값을 찾지 못했습니다."
            exit 1
          fi
          # 접속 비밀번호 확인 함수를 빈 값으로 호출한다 (항상 false, DB를 깨우는 용도)
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/check_gate" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{"pw":""}')
          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase 응답 오류 (HTTP $status)"
            exit 1
          fi

      # GitHub은 저장소에 60일간 활동이 없으면 예약 워크플로를 끈다.
      # 실행할 때마다 자기 자신을 enable 해서 그 카운터를 초기화한다.
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"

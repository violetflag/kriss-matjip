# Supabase 무료 플랜은 7일간 요청이 없으면 프로젝트를 일시정지한다.
# 3일에 한 번 요청 1건으로는 "활동 부족"으로 판정돼 경고 메일이 왔다 (2026-11-04).
# 그래서 하루 2번, DB 조회·RPC·인증 서버 확인을 함께 보낸다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1,13 * * *"   # 매일 10:17, 22:17 KST (정각은 GitHub 지연이 커서 피함)
  workflow_dispatch:          # Actions 탭에서 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # 아래 self-enable 단계용
    steps:
      - uses: actions/checkout@v4

      # URL과 anon 키는 이미 공개된 config.js에서 읽는다 (별도 Secret 불필요)
      - name: Ping Supabase
        run: |
          SUPABASE_URL=$(grep -o 'SUPABASE_URL: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          SUPABASE_ANON_KEY=$(grep -o 'SUPABASE_ANON: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::config.js에서 SUPABASE_URL / SUPABASE_ANON 값을 찾지 못했습니다."
            exit 1
          fi
          fail=0
          ping() {  # $1=설명, 나머지=curl 인자
            name="$1"; shift
            code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$@") || code=000
            echo "$name: HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then fail=1; fi
          }
          # 1) 테이블 조회 (PostgREST → Postgres)
          ping "place_fixes 조회" "$SUPABASE_URL/rest/v1/place_fixes?select=place_id&limit=1"
          # 2) 접속 비밀번호 확인 함수를 빈 값으로 호출 (항상 false)
          ping "check_gate RPC" -X POST "$SUPABASE_URL/rest/v1/rpc/check_gate" \
            -H "Content-Type: application/json" -d '{"pw":""}'
          # 3) 인증 서버 상태 확인
          ping "auth health" "$SUPABASE_URL/auth/v1/health"
          if [ "$fail" -ne 0 ]; then
            echo "::error::Supabase 요청 중 실패가 있습니다."
            exit 1
          fi

      # GitHub은 저장소에 60일간 활동이 없으면 예약 워크플로를 끈다.
      # 실행할 때마다 자기 자신을 enable 해서 그 카운터를 초기화한다.
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
